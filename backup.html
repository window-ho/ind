<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워크플래너 JSON 백업 변환기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        textarea {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-indigo-700 text-white p-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-file-export text-xl text-yellow-300"></i>
                <div>
                    <h1 class="font-bold text-base leading-tight">워크플래너 백업 변환기</h1>
                    <p class="text-[11px] text-indigo-200">텍스트 코드 ➔ JSON 파일 변환 전용</p>
                </div>
            </div>
            <span class="text-[10px] bg-indigo-900 px-2 py-0.5 rounded text-yellow-300 font-bold">보안 적용</span>
        </div>

        <!-- 본문 콘텐츠 -->
        <div class="p-5 space-y-4 text-xs text-slate-700">
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 space-y-1">
                <span class="font-bold text-indigo-900 block text-xs">💡 사용 방법</span>
                <ol class="list-decimal list-inside text-slate-600 space-y-1 text-[11.5px]">
                    <li>아래 <strong>[클립보드 붙여넣기]</strong> 버튼을 누릅니다.</li>
                    <li><strong>[JSON 백업 파일 다운로드]</strong> 버튼을 누릅니다.</li>
                </ol>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="font-bold text-slate-800"><i class="fa-solid fa-code mr-1 text-indigo-600"></i>백업 코드 입력</label>
                    <button onclick="pasteFromClipboard()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-[11px] font-bold shadow-sm">
                        <i class="fa-solid fa-paste mr-1"></i>클립보드 붙여넣기
                    </button>
                </div>
                <textarea id="codeInput" rows="6" placeholder="버튼을 누르거나 여기에 붙여넣으세요..." class="w-full p-3 border rounded-xl font-mono text-[11px] bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none resize-none transition-all border-slate-300"></textarea>
            </div>

            <button onclick="convertToJSON()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-download"></i> JSON 백업 파일 다운로드
            </button>
        </div>

        <!-- 푸터 -->
        <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 text-center text-[10px] text-slate-400">
            Copyright ⓒ windowho@korea.kr All Rights Reserved.
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => {
            if (e.target.tagName !== 'TEXTAREA') e.preventDefault();
        });
        document.addEventListener('copy', e => {
            if (e.target.tagName !== 'TEXTAREA') e.preventDefault();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if ((e.ctrlKey || e.metaKey) && ['u', 's', 'i', 'j', 'p'].includes(e.key.toLowerCase())) {
                if (e.target.tagName !== 'TEXTAREA') { e.preventDefault(); return false; }
            }
        });

        // 클립보드 붙여넣기 버튼 전용 함수
        async function pasteFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('codeInput').value = text;
                    alert('클립보드 내용이 정상적으로 붙여넣어졌습니다!');
                } else {
                    alert('이 브라우저 환경에서는 자동 붙여넣기가 지원되지 않습니다.');
                }
            } catch (err) {
                alert('붙여넣기 권한이 차단되어 있습니다.');
            }
        }

        function convertToJSON() {
            const rawCode = document.getElementById('codeInput').value.trim();
            if (!rawCode) {
                alert('붙여넣은 백업 코드가 없습니다.');
                return;
            }

            try {
                const parsed = JSON.parse(rawCode);
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsed, null, 2));
                const dateStr = new Date().toISOString().slice(0, 10);
                const fileName = `work_planner_backup_${dateStr}.json`;

                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", fileName);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();

                alert(`🎉 ${fileName} 파일 생성이 완료되었습니다!`);
            } catch (e) {
                alert('올바른 백업 코드가 아닙니다. 코드를 정확히 붙여넣었는지 확인해 주세요.');
            }
        }
    </script>
</body>
</html>
